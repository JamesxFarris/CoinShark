services:
  - type: worker
    name: coinshark
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: SOLANA_PRIVATE_KEY
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: PUMPPORTAL_API_KEY
        sync: false
      - key: MAX_BET_SOL
        value: "0.05"
      - key: MAX_POSITIONS
        value: "3"
      - key: SLIPPAGE_PERCENT
        value: "25"
      - key: PRIORITY_FEE_SOL
        value: "0.001"
      - key: TAKE_PROFIT_1_PERCENT
        value: "50"
      - key: TAKE_PROFIT_2_PERCENT
        value: "100"
      - key: STOP_LOSS_PERCENT
        value: "30"
      - key: MAX_TOP_HOLDER_PERCENT
        value: "50"
      - key: MIN_UNIQUE_HOLDERS
        value: "10"
      - key: REQUIRE_MINT_REVOKED
        value: "true"
      - key: REQUIRE_FREEZE_REVOKED
        value: "true"
      - key: MIN_TOKEN_AGE_SECONDS
        value: "30"
      - key: KOL_WALLETS
        sync: false
      - key: MIN_KOL_BUYS
        value: "1"
      - key: MIN_5M_VOLUME_SOL
        value: "5"
      - key: MIN_5M_BUYERS
        value: "10"
      - key: MIN_MARKET_CAP_SOL
        value: "10"
      - key: MAX_MARKET_CAP_SOL
        value: "500"
